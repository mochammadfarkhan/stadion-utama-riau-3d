<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio Skala Nusantara (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; font: 13px system-ui, sans-serif; color: #eee; }
      #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden;
        background: radial-gradient(120% 80% at 50% 38%, #fbf1df 0%, #ecd9b8 55%, #cfb48c 100%); }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #teks, #label { position: absolute; inset: 0; pointer-events: none; font-family: "Inter Variable", "Segoe UI", Arial, sans-serif; }
      .judul { position: absolute; left: 0; right: 0; top: 11%; text-align: center; color: #2a1d12; }
      .judul b { display: block; font-size: calc(var(--h) * 0.068); font-weight: 900; letter-spacing: 0.03em; line-height: 1.02; }
      .judul span { display: inline-block; margin-top: calc(var(--h) * 0.014); font-size: calc(var(--h) * 0.022); font-weight: 700;
        background: #2a1d12; color: #fbf1df; padding: 0.25em 0.8em; border-radius: 2em; }
      .sub { position: absolute; left: 8%; right: 14%; top: 66%; text-align: center; }
      .sub span { display: inline; font-size: calc(var(--h) * 0.03); font-weight: 800; line-height: 1.5; color: #2a1d12;
        background: #fffaf0; padding: 0.15em 0.45em; border-radius: 0.3em; box-decoration-break: clone; -webkit-box-decoration-break: clone;
        box-shadow: 0 0.3vh 1vh rgba(60, 40, 20, 0.18); }
      .sub em { font-style: normal; background: #f2b705; padding: 0 0.15em; border-radius: 0.15em; }
      .narasi span { font-style: italic; font-weight: 700; background: rgba(42, 29, 18, 0.86); color: #fbf1df; }
      .banding { position: absolute; left: 7%; right: 13%; top: 64%; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--h) * 0.008);
        text-align: center; color: #2a1d12; }
      .banding i { grid-column: 1 / 3; font-style: normal; font-weight: 800; font-size: calc(var(--h) * 0.022); letter-spacing: 0.08em;
        text-transform: uppercase; justify-self: center; background: #2a1d12; color: #fbf1df; padding: 0.2em 0.9em; border-radius: 2em; }
      .banding div { background: #fffaf0; border-radius: calc(var(--h) * 0.012); padding: calc(var(--h) * 0.012) 0.4em;
        box-shadow: 0 0.3vh 1vh rgba(60, 40, 20, 0.18); }
      .banding small { display: block; font-size: calc(var(--h) * 0.017); font-weight: 700; opacity: 0.7; }
      .banding b { display: block; font-size: calc(var(--h) * 0.036); font-weight: 900; line-height: 1.15; }
      .banding .kiri { border-top: calc(var(--h) * 0.006) solid #c9962e; }
      .banding .kanan { border-top: calc(var(--h) * 0.006) solid #7bd389; }
      .tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-weight: 900; font-size: calc(var(--h) * 0.019);
        color: #fff; padding: 0.25em 0.7em; border-radius: 2em; box-shadow: 0 0.3vh 1vh rgba(0, 0, 0, 0.25); }
      .tag::after { content: ""; position: absolute; left: 50%; bottom: -0.45em; transform: translateX(-50%);
        border: 0.3em solid transparent; border-top-color: var(--c); }
      .tag { background: var(--c); }
      #aman { position: absolute; inset: 14% 12% 20% 0; border: 2px dashed rgba(255, 80, 80, 0.8); pointer-events: none; display: none; }
      body.aman #aman { display: block; }
      #panel { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: rgba(30, 30, 36, 0.92); padding: 6px 10px; border-radius: 8px; z-index: 2; }
      #panel input[type=range] { width: 260px; }
      body.render #panel { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="label"></div><div id="teks"></div><div id="aman"></div></div>
    <div id="panel"></div>
    <script type="module" src="/src/dev/skalaStudio.js"></script>
  </body>
</html>
