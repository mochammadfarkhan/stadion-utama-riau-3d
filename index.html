<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1016" />
    <title>Stadion Utama Riau — Simulator 3D</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="overlay">
      <div class="panel menu">
        <h1>Stadion Utama Riau</h1>
        <p class="menu-sub">Simulator 3D — Pekanbaru, Riau</p>
        <div id="loading" role="status" aria-live="polite">
          <div class="loading-head"><span id="loading-label">Menyiapkan…</span><span id="loading-percent">0%</span></div>
          <div class="loading-bar"><div id="loading-fill"></div></div>
          <p class="loading-note">Pertama kali memuat butuh beberapa detik, mohon tunggu.</p>
        </div>
        <div class="menu-buttons">
          <button id="start" class="menu-btn primary" type="button" disabled>Memuat aset…</button>
          <button id="menu-new" class="menu-btn hidden" type="button" disabled>Mulai dari awal</button>
          <button id="menu-settings" class="menu-btn" type="button" disabled>Pengaturan</button>
        </div>
        <p id="menu-hint" class="menu-hint"></p>
        <details id="menu-controls">
          <summary>Kontrol</summary>
          <ul><!-- diisi MainMenu dari src/config/controlsHelp.js --></ul>
        </details>
        <p class="menu-credit">MIT · riset: Dispora Riau, StadiumDB · three.js</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
