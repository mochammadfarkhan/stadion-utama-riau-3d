<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stadion Utama Riau — Simulator 3D</title>
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="overlay">
      <div class="panel">
        <h1>Stadion Utama Riau</h1>
        <p>Simulator 3D — Pekanbaru, Riau</p>
        <ul>
          <li><b>W / S</b> kayuh / rem sepeda</li>
          <li><b>A / D</b> belok kiri / kanan</li>
          <li><b>Shift</b> sprint &nbsp; <b>Space</b> bel</li>
          <li><b>Mouse</b> lihat sekeliling &nbsp; <b>V</b> ganti kamera</li>
          <li><b>E</b> beli dari pedagang &nbsp; <b>M</b> minimap</li>
        </ul>
        <button id="start">Klik untuk mulai</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
