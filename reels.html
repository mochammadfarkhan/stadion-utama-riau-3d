<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio reels (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; font: 13px system-ui, sans-serif; color: #eee; }
      #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #000; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #teks { position: absolute; inset: 0; pointer-events: none; font-family: "Inter Variable", "Segoe UI", Arial, sans-serif; }
      .judul { position: absolute; left: 0; right: 0; top: 13%; text-align: center; color: #fff;
        text-shadow: 0 0.4vh 1.6vh rgba(0, 0, 0, 0.55); }
      .judul b { display: block; font-size: calc(var(--h) * 0.075); font-weight: 900; letter-spacing: 0.04em; line-height: 1; }
      .judul span { display: inline-block; margin-top: calc(var(--h) * 0.012); font-size: calc(var(--h) * 0.024); font-weight: 600;
        background: #f2b705; color: #1b1b1f; padding: 0.2em 0.7em; border-radius: 0.4em; text-shadow: none; }
      .sub { position: absolute; left: 8%; right: 14%; top: 64%; text-align: center; }
      .sub span { display: inline; font-size: calc(var(--h) * 0.032); font-weight: 800; line-height: 1.45; color: #1b1b1f;
        background: #fff; padding: 0.15em 0.45em; border-radius: 0.3em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
      /* Panduan zona aman Reels/TikTok: atas 14%, bawah 20% (caption & tombol), kanan 12% (ikon). */
      #aman { position: absolute; inset: 14% 12% 20% 0; border: 2px dashed rgba(255, 80, 80, 0.8); pointer-events: none; display: none; }
      body.aman #aman { display: block; }
      #panel { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: rgba(30, 30, 36, 0.92); padding: 6px 10px; border-radius: 8px; z-index: 2; }
      #panel input[type=range] { width: 260px; }
      body.render #panel { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="teks"></div><div id="aman"></div></div>
    <div id="panel"></div>
    <script type="module" src="/src/dev/reelsStudio.js"></script>
  </body>
</html>
