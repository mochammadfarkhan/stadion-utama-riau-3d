<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo — TimeOfDayControl</title>
    <link rel="stylesheet" href="./time-of-day.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #0e1016; color: #e8ebf2; font-family: system-ui, sans-serif; display: grid; place-items: center; }
      #box { width: 320px; padding: 12px 14px; border-radius: 14px; background: rgba(22, 25, 34, 0.9); box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06); }
      #tools { display: flex; gap: 8px; margin-top: 10px; align-items: center; font-size: 12px; }
      #tools button { padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.15); background: #1d2130; color: inherit; cursor: pointer; }
      #log { font-family: ui-monospace, monospace; color: #9aa3b5; }
    </style>
  </head>
  <body>
    <div>
      <div id="box"></div>
      <div id="tools">
        <button id="run" type="button">Jalankan</button>
        <button id="stop" type="button">Berhenti</button>
        <span id="log"></span>
      </div>
    </div>
    <script type="module" src="./demo-tod.js"></script>
  </body>
</html>
